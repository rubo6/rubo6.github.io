name: 'Visual / accessibility bug'
description: Something looks wrong or is not accessible
title: 'fix: <short description>'
labels: ['bug']
body:
  - type: input
    id: url
    attributes:
      label: Page URL
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [night, atlas, both]
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [pro, personal, both]
  - type: input
    id: device
    attributes:
      label: Browser / device
  - type: textarea
    id: what
    attributes:
      label: What happens vs. what you expected
    validations:
      required: true
