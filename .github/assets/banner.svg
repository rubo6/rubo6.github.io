<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Rubo — Personal Observatory">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b3d"/>
      <stop offset="1" stop-color="#0b1026"/>
    </linearGradient>
    <radialGradient id="neb1" cx="0.78" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#f07a6e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f07a6e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.9" cy="0.8" r="0.45">
      <stop offset="0" stop-color="#9ad9e8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9ad9e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb3" cx="0.62" cy="0.55" r="0.35">
      <stop offset="0" stop-color="#f2c46d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f2c46d" stop-opacity="0"/>
    </radialGradient>
    <style>
      .tw { animation: tw 3.2s ease-in-out infinite; }
      .tw.a { animation-delay: -0.4s; } .tw.b { animation-delay: -1.1s; } .tw.c { animation-delay: -1.9s; } .tw.d { animation-delay: -2.6s; }
      @keyframes tw { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      .orbit { transform-origin: 1010px 150px; animation: spin 24s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .display { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; }
      .mono { font-family: Consolas, 'JetBrains Mono', 'Courier New', monospace; letter-spacing: 3px; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#sky)"/>
  <rect width="1200" height="300" rx="18" fill="url(#neb1)"/>
  <rect width="1200" height="300" rx="18" fill="url(#neb2)"/>
  <rect width="1200" height="300" rx="18" fill="url(#neb3)"/>

  <!-- star field (deterministic positions) -->
  <g fill="#f4efe6">
    <circle class="tw a" cx="80" cy="40" r="1.6"/><circle class="tw b" cx="140" cy="230" r="1.2"/><circle class="tw c" cx="230" cy="70" r="1.9"/>
    <circle class="tw d" cx="310" cy="250" r="1.1"/><circle class="tw a" cx="420" cy="30" r="1.3"/><circle class="tw b" cx="480" cy="270" r="1.7"/>
    <circle class="tw c" cx="560" cy="60" r="1.2"/><circle class="tw d" cx="620" cy="220" r="2.1"/><circle class="tw a" cx="700" cy="120" r="1.4"/>
    <circle class="tw b" cx="760" cy="40" r="1.8"/><circle class="tw c" cx="830" cy="260" r="1.3"/><circle class="tw d" cx="880" cy="90" r="1.6"/>
    <circle class="tw a" cx="950" cy="30" r="1.2"/><circle class="tw b" cx="1120" cy="60" r="1.9"/><circle class="tw c" cx="1150" cy="240" r="1.4"/>
    <circle class="tw d" cx="1060" cy="280" r="1.1"/><circle class="tw a" cx="380" cy="150" r="1.0"/><circle class="tw b" cx="520" cy="170" r="1.1"/>
    <circle class="tw c" cx="660" cy="290" r="1.3"/><circle class="tw d" cx="1180" cy="150" r="1.2"/>
  </g>

  <!-- orbit mark -->
  <g transform="translate(1010 150)">
    <circle r="62" fill="none" stroke="#f2c46d" stroke-opacity=".45" stroke-width="1.5"/>
    <circle r="40" fill="none" stroke="#f4efe6" stroke-opacity=".18" stroke-width="1" stroke-dasharray="3 6"/>
    <circle r="9" fill="#f2c46d"/>
  </g>
  <g class="orbit">
    <circle cx="1072" cy="150" r="4.5" fill="#f07a6e"/>
    <circle cx="1010" cy="110" r="3.5" fill="#9ad9e8"/>
  </g>

  <text x="64" y="120" class="display" font-size="56" fill="#f4efe6">Rubo · Observatory</text>
  <text x="64" y="166" class="display" font-size="24" fill="#f2c46d">Eduardo Rubén Bernal Puente — Data &amp; Analytics Engineer</text>
  <text x="64" y="216" class="mono" font-size="14" fill="#9ad9e8">ASTRO 7 · TYPESCRIPT · TAILWIND 4 · REAL ASTRONOMY · ZERO THIRD-PARTY REQUESTS</text>
  <text x="64" y="250" class="mono" font-size="13" fill="#b9b6c9">rubo6.github.io</text>
</svg>
